# Render Blueprint — auto-configures the backend service
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: craf-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build && npx prisma db push && npx tsx prisma/seed.ts
    startCommand: node dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
